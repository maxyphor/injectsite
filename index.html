<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <!-- Instant redirect (works even without JavaScript) -->
  <meta http-equiv="refresh" content="0; url=https://inject5.cc">
  <!-- JavaScript redirect (replace() keeps this page out of the back-button history) -->
  <script>
    window.location.replace("https://inject5.cc");
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://inject5.cc">https://inject5.cc</a>…</p>
</body>
</html>
